<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Logo</title>
    <link rel="stylesheet" href="logo-animation.css">
</head>

<body>
    <div class="logo-container">
        <div class="logo-card">
            <div class="logo-face logo-front">
                <img id="front-img" src="" alt="Logo Front">
            </div>
            <div class="logo-face logo-back">
                <img id="back-img" src="" alt="Logo Back">
            </div>
        </div>
    </div>
    <script src="logo-animation.js"></script>
</body>

</html>
