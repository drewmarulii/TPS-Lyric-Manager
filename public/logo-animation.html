<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Logo</title>
    <link rel="stylesheet" href="logo-animation.css">
</head>

<body>
    <div class="logo-container">
        <div class="logo-card">
            <div class="logo-face logo-front">
                <img src="LOGO-TPS.png" alt="Logo 1">
            </div>
            <div class="logo-face logo-back">
                <img src="LOGO-ONEVOICE.png" alt="Logo 2">
            </div>
        </div>
    </div>
    <script src="logo-animation.js"></script>
</body>
</html>
